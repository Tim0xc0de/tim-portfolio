baseURL = "https://www.tim-mehmeti.dev/"
title = "Tim Mehmeti"
theme = "PaperMod"


defaultContentLanguage = "de"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 5

[params.assets]
    disableFingerprinting = true
    disableHLJS = true
    favicon = "favicon.svg"
    favicon16x16 = "favicon.svg"
    favicon32x32 = "favicon.svg"
    apple_touch_icon = "favicon.svg"

[outputs]
  home = ["HTML", "JSON"]

[languages]
  [languages.en]
    languageName = "English"
    weight = 2
    contentDir = "content/en"
    title = "Tim Mehmeti — Enterprise Integration & Backend Developer"

    [languages.en.params.profileMode]
      enabled = true
      title = "Tim Mehmeti | Enterprise Integration & Backend Developer"
      subtitle = "Enterprise integration specialist with backend roots in Java, C# and .NET. I connect enterprise systems via ESB, SOA and REST APIs — and build clean interfaces for digital workflows. Always interested in new challenges and technical exchange."
      imageUrl = "images/timmehmemeti_pb.jpg"
      imageWidth = 160
      imageHeight = 160
      imageTitle = "Tim Mehmeti"

    [[languages.en.params.profileMode.buttons]]
      name = "Work & Experience"
      url = "projects/"

    [[languages.en.params.profileMode.buttons]]
      name = "About Me"
      url = "about/"

    [[languages.en.params.profileMode.buttons]]
      name = "Blog"
      url = "blog/"

    [[languages.en.menu.main]]
      name = "Home"
      url = ""
      weight = 5

    [[languages.en.menu.main]]
      name = "About"
      url = "about/"
      weight = 10

    [[languages.en.menu.main]]
      name = "Work & Experience"
      url = "projects/"
      weight = 20

    [[languages.en.menu.main]]
      name = "At a Glance"
      url = "timeline/"
      weight = 15

    [[languages.en.menu.main]]
      name = "Blog"
      url = "blog/"
      weight = 25

  [languages.de]
    languageName = "Deutsch"
    weight = 1
    contentDir = "content/de"
    title = "Tim Mehmeti — Enterprise Integration & Backend Entwickler"

    [languages.de.params.profileMode]
      enabled = true
      title = "Tim Mehmeti | Enterprise Integration & Backend Developer"
      subtitle = "Spezialist für Enterprise Integration mit Backend-Wurzeln in Java, C# und .NET. Ich verbinde Unternehmenssysteme über ESB, SOA und REST-APIs und baue saubere Schnittstellen für digitale Abläufe. Immer interessiert an neuen Herausforderungen und technischem Austausch."
      imageUrl = "images/timmehmemeti_pb.jpg"
      imageWidth = 160
      imageHeight = 160
      imageTitle = "Tim Mehmeti"

    [[languages.de.params.profileMode.buttons]]
      name = "Arbeit & Erfahrung"
      url = "projects/"

    [[languages.de.params.profileMode.buttons]]
      name = "Über mich"
      url = "about/"

    [[languages.de.params.profileMode.buttons]]
      name = "Blog"
      url = "blog/"

    [[languages.de.menu.main]]
      name = "Start"
      url = ""
      weight = 5

    [[languages.de.menu.main]]
      name = "Über mich"
      url = "about/"
      weight = 10

    [[languages.de.menu.main]]
      name = "Arbeit & Erfahrung"
      url = "projects/"
      weight = 20

    [[languages.de.menu.main]]
      name = "Kurz und Knapp"
      url = "timeline/"
      weight = 15

    [[languages.de.menu.main]]
      name = "Blog"
      url = "blog/"
      weight = 25

[params]
  env = "production"
  description = "Tim Mehmeti - Enterprise Integration Specialist and Backend Developer: SOA, Enterprise Service Bus, REST APIs, Java and .NET"
  author = "Tim Mehmeti"
  
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowLanguageSwitcher = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.label]
    text = "Tim Mehmeti"
    icon = "images/timmehmemeti_pb.jpg"
    iconHeight = 35

[markup]
  [markup.highlight]
    noClasses = false
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "dracula"

  [markup.goldmark.renderer]
    unsafe = true